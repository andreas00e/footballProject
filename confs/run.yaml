mode: predict # can also be set through the comamnd line with "mode=train" or "mode=predict"

seed_everything:
  seed: 42
  workers: True
  verbose: False

project_dir: /home/ehre/Documents/Projects/footballProject
save_dir: /home/ehre/Documents/Projects/footballProject/logs

data:
  dataset:  
    data_dir: ${project_dir}/data/nfl-big-data-bowl-2026-prediction/train_test # /train, /train_inv, /train_test (only one input, and one output file for faster testing)
    scaling_path: ${project_dir}/confs/values/updated_min_max_values.yaml    
    pos_path: ${project_dir}/data/positions/positions.txt  
    feature_config: ${data_features}
    data_type: graph # sequential 
    mode: ${mode}

  random_split: 
    lengths:
      - 0.8
      - 0.2

  dataloading: 
    batch_size: 1
    shuffle: True
    num_workers: 15
    persistent_workers: True 
    drop_last: True

data_features:
  loading: # variables that are only relevant during dataloading but are not passed to the model itself
  - game_id
  - play_id
  - nfl_id
  - frame_id
  
  model:
    norm: # variables that need to be normalized to [0, 1] 
    - absolute_yardline_number
    - player_height
    - player_weight
    - player_position
    - x 
    - y
    - s 
    - a 
    - dir 
    - o

    no_norm: # variables that do not need to be normalized 
    - player_to_predict
    - play_direction
    - player_side
    - num_frames_output

  used: ${add_3:${data_features.loading}, ${data_features.model.norm}, ${data_features.model.no_norm}}

  not_used: # variables present in the dataset, but unused in both data pre-processing and model
   - player_name
   - num_frames_output
   - ball_land_x 
   - ball_land_y

data_info: 
  norm_length: ${len:${data_features.model.norm}}
  no_norm_length: ${len:${data_features.model.no_norm}}
  features: ${sub_2:${add_2:${data_info.norm_length},${data_info.no_norm_length}},1}    

model: 
  data: 
    max_players: 17

  optimizer: 
    lr: 1e-3

  lr_scheduler: 
    T_max: 1e4 
    eta_min: 1e-4

  transformer: 
    encoder_layer: 
      d_model: 16
      nhead: 8
      dim_feedforward: 32 
    decoder: 
      num_layers: 4
    positional_encoding: 
      d_model: ${model.transformer.encoder_layer.d_model}
      dropout: 0.1
      max_len: 150

  graph:
    encoder: 
      in_channels: ${data_info.features} 
      hidden_channels: 20 
      num_layers: 10
      out_channels: ${model.transformer.encoder_layer.d_model}
    decoder: 
      in_channels: ${model.transformer.encoder_layer.d_model} 
      hidden_channels: 20
      num_layers: 10
      out_channels: ${data_info.features}

logger: 
  name: NFLogger_graph
  save_dir: ${save_dir}/logger
  version: test_04_15_01
  project: GetRichOrDieTrying
  log_model: all 
  checkpoint_name: checkpoint_logger

modelCheckpoint: 
  dirpath: ${save_dir}/checkpoint_graph_model
  filename: WhatAModelTheBestModelEverybodySaysThat
  monitor: val_loss
  save_top_k: 1 
  mode: min

profiler: 
  dirpath: ${save_dir}/profiler

trainer:  
  max_epochs: 100
  log_every_n_steps: 5
  limit_predict_batches: 1.0

prediction: 
  test_dir: ${project_dir}/data/nfl-big-data-bowl-2026-prediction/test_input.csv
  checkpoint_path: ${modelCheckpoint.dirpath}/${modelCheckpoint.filename}.ckpt