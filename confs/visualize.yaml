defaults:
  - values: updated_min_max_values
  - _self_
fig: 
  ratio: 1.7778
  factor: 7.5 
  x_size: ${mult_2:${fig.ratio}, ${fig.factor}}
  y_size: ${fig.factor}

data_dir: data/nfl-big-data-bowl-2026-prediction/train
background_img: data/images/field.jpeg

features:
  - game_id
  - play_id
  - player_to_predict
  - nfl_id
  - frame_id
  - play_direction
  - player_name
  - player_position
  - player_side
  - x
  - y
  - s
  - a
  - dir
  - o

extrema: 
  x_min: ${values.x.min}
  x_max: ${values.x.max}
  y_min: ${values.y.min}
  y_max: ${values.y.max}

pick_random: False

identifiers: #TODO: Include the option to randomly pick plays
  week: 2 # [1, 18]
  game_id: 2023091400 # look up in csv file(s)
  play_id: 2523 # look up in csv file(s)