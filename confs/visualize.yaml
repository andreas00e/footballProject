defaults:
  - values: updated_min_max_values
  - _self_

_: ${values}

data_dir: data/nfl-big-data-bowl-2026-prediction/train
bg_img: data/images/field.jpeg
ball_img: data/images/football.png

pick_rand: False 

ids: # ids for the games and the play can be found in the csv files 
  week: 13 # [1, 18]
  game_id: 2023120310
  play_id: 3542

features: 
  load: 
    - game_id
    - play_id
    - frame_id
    - nfl_id 
    - player_to_predict
    - play_direction
    - player_name
    - player_position
    - player_side
    - o
  norm: 
    - x
    - y
    - s
    - a
    - dir
    # - o
    - ball_land_x 
    - ball_land_y

visualization: 
  options: 
    - traces
    - shapes

  fig: 
    parameters: 
      ratio: 1.7778
      factor: 7.5 
    sizes: 
      x_size: ${mult_2:${visualization.fig.parameters.factor},${visualization.fig.parameters.ratio}}
      y_size: ${visualization.fig.parameters.factor}

  extrema:
    x: ${values.x}
    y: ${values.y}
    s: ${values.s}
    a: ${values.a}
    dir: ${values.dir}
    ball_land_x: ${values.x}
    ball_land_y: ${values.y}

  animation:
    filename: ~/Documents/${ids.week}_${ids.game_id}_{ids.play_id}.mp4 # ./visualization/${ids.week}_${ids.game_id}_{ids.play_id}.mp4
    # filename: ./visualization/play.mp4
    writer: ffmpeg
    fps: 16
    dpi: 200.0