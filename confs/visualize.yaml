defaults:
  - values: updated_min_max_values
  - _self_

_: ${values}

data_dir: data/nfl-big-data-bowl-2026-prediction/train
bg_img: data/images/field.jpeg

pick_rand: False

ids: # ids for the games and the play can be found in the csv files 
  week: 2 # [1, 18]
  game_id: 2023091400
  play_id: 2523

features: 
  load: 
    - game_id
    - play_id
    - frame_id
    - nfl_id 
    - player_to_predict
    - play_direction
    - player_name
    - player_position
    - player_side
  norm: 
    - x
    - y
    - s
    - a
    - dir
    - o

visualization: 
  options: 
    - traces
    - shapes

  fig: 
    parameters: 
      ratio: 1.7778
      factor: 7.5 
    sizes: 
      x_size: ${mult_2:${visualization.fig.parameters.factor},${visualization.fig.parameters.ratio}}
      y_size: ${visualization.fig.parameters.factor}

  extrema:
    x: ${values.x}
    y: ${values.y}
    s: ${values.s}
    a: ${values.a}
    dir: ${values.dir}
    o: ${values.o}

  animation:
    filename: ./visualization/play.mp4
    writer: ffmpeg
    fps: 0.25 
    dpi: 200.0
    # extra_args:
    #  - pix_fmt
    #  - yuv420p