defaults:
  - values: updated_min_max_values
  - _self_

data_dir: data/nfl-big-data-bowl-2026-prediction/train
background_img: data/images/field.jpeg

features:
  - game_id
  - play_id
  - player_to_predict
  - nfl_id
  - frame_id
  - play_direction
  - player_name
  - player_position
  - player_side
  - x
  - y
  - s
  - a
  - dir
  - o

extrema: 
  x_min: ${values.x.min}
  x_max: ${values.x.max}
  y_min: ${values.y.min}
  y_max: ${values.y.max}

identifiers: #TODO: Include the option to randomly pick plays
  week: 17 # [1, 18]
  game_id: 2023122800 # look up in csv file(s)
  play_id: 138 # look up in csv file(s)